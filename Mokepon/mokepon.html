<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>MOKEPON!</title>
    <link rel="stylesheet" href="./styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <section id="seleccionar-mascota">
        <h1 id="titulo">MOKEPON! </h1>

        <h2 class="Subtitulo">Elige tu mascota:</h2>

        <div id="contenedorTarjetas" class="Tarjetas">
        </div>

        <button id="boton-mascota">Seleccionar</button>
    </section>

    <section id="ver-mapa">
        <h1 id="titulo">Recorre el mapa con tu mokepon</h1>
        <canvas id="mapa"></canvas>
        <div class="botones-movimiento">
            <button onmousedown="moverArriba()" onmouseup="detenerMovimiento()" ontouchstart="moverArriba()" ontouchend="detenerMovimiento()">Arriba ⬆️</button>
            <div>
                <button onmousedown="moverIzquierda()" onmouseup="detenerMovimiento()" ontouchstart="moverIzquierda()" ontouchend="detenerMovimiento()">Izquierda ⬅️</button>
                <button onmousedown="moverDerecha()" onmouseup="detenerMovimiento()" ontouchstart="moverDerecha()" ontouchend="detenerMovimiento()">Derecha ➡️</button>
            </div>
            <button onmousedown="moverAbajo()" onmouseup="detenerMovimiento()" ontouchstart="moverAbajo()" ontouchend="detenerMovimiento()">Abajo ⬇️</button>
        </div>
    </section>

    <section id="seleccionar-ataque">
        <h1 id="titulo">MOKEPON! </h1>

        <h2 class="Subtitulo">Elige tu ataque:</h2>

        <div id="contenedorAtaques" class="tarjetas-ataques">
        </div>

        <div id="mensajes">
            <p id="resultado">Mucha Suerte</p>

            <section id="reiniciar">
                <button id="boton-reiniciar">Reiniciar</button>
            </section>
        </div>
        <div class="ataques">

            <div class="ataques-jugador">
                <p id="vidas-jugador">3</p>
                <p id="mascota-jugador"></p>
                <div id="ataques-del-jugador"></div>
            </div>

            <div class="ataques-enemigo">
                <p id="vidas-enemigo">3</p>
                <p id="mascota-enemigo"></p>
                <div id="ataques-del-enemigo"></div>
            </div>

        </div>
    </section>
    <script src="./js/mokepon.js"></script>
</body>

</html>
